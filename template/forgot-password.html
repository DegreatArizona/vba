<!doctype html>
<html lang="en">
    <head>
        <title>Forgotten Password</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />
        <style>
.request-container {
    width: 90%;
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}
.request-container input, .request-container textarea, .request-container select{
    width: 100%;
    outline: none;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(10, 116, 218, 0.90);
}
.request-container label{
    display: block;
    font-size: 1rem;
    cursor: pointer;
}
.request-container button, .request-container a{
    width: 100%;
    cursor: pointer;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(10, 116, 218, 0.90);
    margin-top: 20px;
}
</style>
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
        
        <div class="container">
        {% if  messages %}
        {% for message in messages %}
        <div class="alert alert-{{message.tags}} alert-dismissible fade show" role="alert">
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          <strong>{{message}}</strong>
        </div>
        {% endfor %}
        {% endif %}
        </div>
       <div class="request-container">
    <h2>Recover Your Password</h2>
    <form id="paymentForm" method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input
                type="email"
                class="form-control"
                name="email"
                id="email"
                aria-describedby="helpId"
                placeholder="email"
            />
        </div>
        
        <small id="helpId" class="form-text text-muted">Input your registered email</small>
        <button class="btn btn-primary" type="submit">Send</button>
    </form>
    <a class="btn btn-outline-primary" href="/">Go Back</a>
</div></main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
