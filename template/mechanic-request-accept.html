{% extends "mechanicbase.html" %}
{% load static %}
{% block content %}
<style>
.request-container {
    width: 90%;
    max-width: 800px;
    margin: 20px auto;
    padding: 20px;
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}
.request-container input, .request-container textarea, .request-container select{
    width: 100%;
    outline: none;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(10, 116, 218, 0.90);
}
.request-container label{
    display: block;
    font-size: 1rem;
    cursor: pointer;
}
.request-container button, .request-container a{
    width: 100%;
    cursor: pointer;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid rgba(10, 116, 218, 0.90);
    margin-top: 20px;
}
</style>
<div class="request-container">
    <h2>Accept Request</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="input-field">
            <label for="mechanic_mobile" class="input-label">Phone Number</label>
            <input type="text" id="mechanic_mobile" name="mechanic_mobile" required />
        </div>

        <div class="input-field">
            <label for="mechanic_location" class="input-label">Your Location</label>
            <input type="text" id="mechanic_location" name="mechanic_location" required />
        </div>

        <button class="btn btn-primary" type="submit">Accept Request</button>
    </form>
    <a class="btn btn-outline-primary" href="{% url 'mechanic-dashboard' %}">Go Back</a>
</div>

{% endblock content %}
